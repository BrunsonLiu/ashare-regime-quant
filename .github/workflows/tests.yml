name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 测试套件不依赖网络与重依赖: akshare/baostock 缺失时 helpers 自动注入 stub。
      # requests 例外 —— src/direct_data.py 在模块级 import, 不装会直接收集中断
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24,<2.3" "requests>=2.28" "pytest>=7.0"

      - name: Run tests
        run: python -m pytest tests/ -v
