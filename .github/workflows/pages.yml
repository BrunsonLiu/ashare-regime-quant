# 把 web/ 发布到 GitHub Pages(公网可访问的静态站)
# 使用前提: 仓库 Settings → Pages → Source 选 "GitHub Actions"
# 注意: 私有仓库的 Pages 需要 GitHub 付费计划; 公开仓库免费。
name: Deploy web to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
