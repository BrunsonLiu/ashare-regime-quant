<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易信号 · Signals</title>
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<main id="main">
  <div class="page-header">
    <div>
      <div class="page-title">交易信号</div>
      <div class="page-subtitle" id="snapshot-time">快照时间: --</div>
    </div>
  </div>

  <div class="kpi-row" id="signal-kpi">
    <div class="loading">加载中</div>
  </div>

  <div class="chart-card span-2" style="margin-bottom:12px">
    <div class="card-header">
      <h3>信号明细</h3>
      <div class="card-actions">
        <input type="text" id="signal-search" placeholder="搜索代码 / 名称..." class="search-input" style="font-size:11px;padding:4px 10px">
      </div>
    </div>
    <div id="signal-table-wrap" class="table-wrap">
      <div class="loading">加载中</div>
    </div>
  </div>
</main>

<script src="js/shared.js"></script>
<script>
renderLayout('signals');

let signalData = null;
let filtered = [];

(async () => {
  const { status, data } = await DataLoader.loadStatus('signals');
  if (!data) {
    const missing = status === 404;
    document.getElementById('snapshot-time').textContent =
      missing ? '快照时间: 未生成' : `快照时间: 加载失败(HTTP ${status || '解析错误'})`;
    document.getElementById('signal-kpi').innerHTML = `<div class="callout wait" style="grid-column:1/-1">
      本页数据依赖 <code>data/latest_signals.csv</code>，仓库当前未附带该文件。
      需要时依次执行 <code>python main.py signal</code> 生成信号，
      再 <code>python main.py gen-webdata</code> 导出 <code>web/data/signals.json</code>。
    </div>`;
    renderEmpty(
      'signal-table-wrap',
      missing ? '暂无信号数据' : '信号数据解析失败',
      missing ? 'python main.py signal && python main.py gen-webdata' : '打开控制台查看 DataLoader 报错'
    );
    return;
  }

  signalData = data;
  document.getElementById('snapshot-time').textContent = `快照时间: ${data.snapshot_time}`;
  
  // KPI
  document.getElementById('signal-kpi').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">总信号数</div>
      <div class="kpi-value">${data.count}</div>
    </div>
    <div class="kpi-card good">
      <div class="kpi-label">买入信号</div>
      <div class="kpi-value">${data.buy_count}</div>
    </div>
    <div class="kpi-card alert">
      <div class="kpi-label">卖出信号</div>
      <div class="kpi-value">${data.sell_count}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">快照时间</div>
      <div class="kpi-value is-date">${(data.snapshot_time || '').slice(5, 16) || '--'}</div>
    </div>
  `;
  
  filtered = data.rows.map((r, i) => ({ row: r, idx: i }));
  renderTable();
  
  document.getElementById('signal-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    filtered = data.rows
      .map((r, i) => ({ row: r, idx: i }))
      .filter(({ row }) => row.some(v => String(v).toLowerCase().includes(q)));
    renderTable();
  });
})();

function renderTable() {
  if (!signalData) return;
  const cols = signalData.columns;
  const headerHtml = cols.map(c => `<th>${c}</th>`).join('');
  
  const bodyHtml = filtered.map(({ row }) => {
    const cells = row.map((v, i) => {
      const col = cols[i];
      let cls = '';
      if (col === 'signal' || col === 'action') {
        cls = v === 'BUY' || v > 0 ? 'buy' : v === 'SELL' || v < 0 ? 'sell' : '';
      }
      if (col === 'pnl' && v !== null && v !== '') {
        const num = parseFloat(v);
        cls = num > 0 ? 'profit' : 'loss';
      }
      const display = v === null || v === undefined ? '' : 
                      (typeof v === 'number' ? v.toFixed(2) : String(v));
      return `<td class="${cls}">${display}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  
  document.getElementById('signal-table-wrap').innerHTML =
    `<table><thead><tr>${headerHtml}</tr></thead><tbody>${bodyHtml || '<tr><td colspan="20"><div class="empty-state"><div class="empty-title">无匹配记录</div></div></td></tr>'}</tbody></table>`;
}
</script>
</body>
</html>
