<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日决策 · Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<style>
  .env-hero { padding: 28px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
  .env-hero.A { background: linear-gradient(135deg, rgba(62,224,126,0.12), transparent); border-color: rgba(62,224,126,0.4); }
  .env-hero.B { background: linear-gradient(135deg, rgba(255,183,77,0.10), transparent); border-color: rgba(255,183,77,0.35); }
  .env-hero.C { background: linear-gradient(135deg, rgba(91,156,245,0.10), transparent); border-color: rgba(91,156,245,0.35); }
  .env-hero.D { background: linear-gradient(135deg, rgba(255,92,92,0.12), transparent); border-color: rgba(255,92,92,0.4); }
  .env-letter { font-size: 64px; font-weight: 700; font-family: var(--font-mono); line-height: 1; }
  .env-hero.A .env-letter { color: var(--green); }
  .env-hero.B .env-letter { color: var(--yellow); }
  .env-hero.C .env-letter { color: var(--blue); }
  .env-hero.D .env-letter { color: var(--red); }
</style>
</head>
<body>

<main id="main">
  <div class="page-header">
    <div>
      <div class="page-title">每日决策助手</div>
      <div class="page-subtitle" id="snap">加载中...</div>
    </div>
    <button class="range-btn" onclick="location.reload()">↻ 刷新</button>
  </div>

  <div id="daily-container"><div class="loading">加载中</div></div>
</main>

<script src="js/shared.js"></script>
<script>
renderLayout('daily');

(async () => {
  const d = await DataLoader.load('daily');
  if (!d) { showError('决策数据加载失败，请先运行: python main.py gen-webdata'); return; }
  document.getElementById('snap').textContent = `数据截至 ${d.snapshot_time}`;

  const actionMap = {
    A: '可持仓 · 建议仓位上限 ' + d.exposure_pct + '%（做主线龙头，让利润奔跑）',
    B: '轻仓或空仓（主线散乱，追热点易被套）',
    C: '轻仓快进快出（超跌反弹，严格止损）',
    D: '空仓观望（均线空头，保存实力）',
  };

  let html = `
    <div class="env-hero ${d.env}">
      <div style="display:flex;align-items:center;gap:24px">
        <div class="env-letter">${d.env}</div>
        <div>
          <div style="font-size:18px;color:var(--text-bright);margin-bottom:6px">${d.env_desc}</div>
          <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px">${actionMap[d.env] || ''}</div>
          <div style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">
            仓位上限 ${d.exposure_pct}% · 守则第一章环境判断
          </div>
        </div>
      </div>
    </div>
  `;

  // 主线行业
  html += `<div class="chart-card span-2" style="margin-bottom:20px">
    <div class="card-header"><h3>当前情绪主线（涨停热度 = 涨停家数 + 连板高度×3）</h3>
    <span class="card-hint">情绪数据识别主线，非价格动量</span></div>
    <div class="table-wrap" style="max-height:none">
    <table><thead><tr><th>行业</th><th>涨停家数</th><th>最高连板</th><th>热度</th></tr></thead><tbody>`;
  (d.industry_heat || []).forEach(h => {
    html += `<tr><td>${h.industry}</td><td>${h.zt}</td><td>${h.lb}</td>
      <td style="color:var(--accent);font-weight:600">${h.heat}</td></tr>`;
  });
  html += `</tbody></table></div></div>`;

  // 建议龙头
  html += `<div class="chart-card span-2">
    <div class="card-header"><h3>建议关注龙头（主线行业内的行业龙头）</h3></div>
    <div class="table-wrap" style="max-height:none">
    <table><thead><tr><th>行业</th><th>代码</th><th>名称</th></tr></thead><tbody>`;
  (d.leaders || []).forEach(l => {
    html += `<tr><td>${l.industry}</td><td style="font-family:var(--font-mono)">${l.code}</td>
      <td><a href="https://stockpage.10jqka.com.cn/${l.code.replace(/^0+/,'')}/" target="_blank">${l.name}</a></td></tr>`;
  });
  html += `</tbody></table></div></div>`;

  html += `<div style="margin-top:20px;padding:16px;font-size:11px;color:var(--text-dim);line-height:1.8;border-top:1px solid var(--border)">
    策略依据（3.5年验证，STRATEGY_CONCLUSION.md）：行业龙头池 + 只在A主线环境持有 + 低换手。
    12年跨周期验证：熊市空仓 收益+234.2% / 回撤-33.7%（vs 全程持有 +85.5% / -52.3%）。
    <br>本页面不构成投资建议。</div>`;

  document.getElementById('daily-container').innerHTML = html;
})();
</script>
</body>
</html>
