<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日决策 · 龙头量化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<style>
  /* === 顶部决策条(紧凑单行) === */
  .envbar {
    display: flex; align-items: center; gap: 0;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 2px; margin-bottom: 10px; overflow: hidden;
  }
  .envbar .tag {
    font-family: var(--mono); font-weight: 700; font-size: 18px;
    padding: 10px 16px; align-self: stretch; display: flex; align-items: center;
  }
  .envbar.A .tag { background: var(--up); color: #fff; }
  .envbar.B .tag { background: var(--yellow); color: #fff; }
  .envbar.C .tag { background: var(--blue); color: #fff; }
  .envbar.D .tag { background: var(--down); color: #fff; }
  .envbar .seg { padding: 7px 16px; border-right: 1px solid var(--border); }
  .envbar .seg:last-child { border-right: none; }
  .envbar .seg .k { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
  .envbar .seg .v { font-size: 14px; font-weight: 600; color: var(--text-bright); font-family: var(--font-mono); }
  .envbar .seg .v.sub { font-size: 12px; font-weight: 400; color: var(--text-2); font-family: var(--font); }
  .envbar .grow { flex: 1; }
  .envbar .seg.act { padding: 10px 18px; }
  .envbar .act-txt { font-size: 12px; color: var(--text-dim); }

  /* === 两栏: 主线行业 / 候选龙头 === */
  .two-col { display: grid; grid-template-columns: 340px 1fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }

  /* 表格紧凑化 */
  .dense th { padding: 6px 10px; font-size: 11px; }
  .dense td { padding: 5px 10px; font-size: 12px; }
  .dense tr.hl td { background: #eaf1fb; }
  .dense td.lead { color: var(--accent); font-weight: 600; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

  .veto-row td { opacity: 0.45; }
  .note { padding: 8px 12px; font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border); background: var(--panel-alt); }
  .note.warn { color: var(--up); }
</style>
</head>
<body>

<main id="main">
  <div class="page-header">
    <div>
      <div class="page-title">每日决策</div>
      <div class="page-subtitle" id="snap">加载中...</div>
    </div>
    <button class="range-btn" onclick="location.reload()">↻ 刷新</button>
  </div>

  <div id="daily-container"><div class="loading">加载中</div></div>
</main>

<script src="js/shared.js"></script>
<script>
renderLayout('daily');

const chg = (v) => v === null || v === undefined ? '--'
  : `<span class="${v > 0 ? 'q-up' : v < 0 ? 'q-down' : ''}">${v > 0 ? '+' : ''}${v}%</span>`;
const pct = (v) => v === null || v === undefined ? '--'
  : `<span class="${v > 0 ? 'q-up' : v < 0 ? 'q-down' : ''}">${v > 0 ? '+' : ''}${v}%</span>`;

(async () => {
  const d = await DataLoader.load('daily');
  if (!d) { showError('决策数据加载失败，请先运行: python main.py gen-webdata'); return; }
  document.getElementById('snap').textContent = `数据截至 ${d.snapshot_time}`;
  const st = d.stats || {};

  // === 顶部决策条: 环境 + 仓位 + 温度 (一行, 不重复) ===
  const confirmed = d.confirmed;
  const envNote = d.env === 'A'
    ? (confirmed ? '已确认' : '确认中(未满3天)') : '';
  let html = `
  <div class="envbar ${d.env}">
    <div class="tag">${d.env}</div>
    <div class="seg"><div class="k">环境</div>
      <div class="v sub">${d.env_desc.split(':')[0]}${envNote ? ' · ' + envNote : ''}</div></div>
    <div class="seg"><div class="k">建议仓位上限</div>
      <div class="v" style="color:${d.exposure_pct > 0 ? 'var(--accent)' : 'var(--text-dim)'}">${d.exposure_pct}%</div></div>
    <div class="seg"><div class="k">涨停家数</div><div class="v">${st.zt_today ?? '--'}</div></div>
    <div class="seg"><div class="k">最高连板</div><div class="v">${st.max_lb ?? '--'}</div></div>
    <div class="grow"></div>
    <div class="seg act"><div class="act-txt">${d.action || ''}</div></div>
  </div>`;

  // === 两栏 ===
  html += `<div class="two-col">`;

  // 左: 主线行业(紧凑表)
  html += `<div class="chart-card">
    <div class="card-header"><h3>主线行业</h3><span class="card-hint">同花顺 · 走势排名</span></div>
    <table class="dense"><thead><tr><th>行业</th>
      <th class="num">近1年</th><th class="num">近3年</th></tr></thead><tbody>`;
  (d.industry_rank || []).slice(0, 10).forEach(r => {
    const hl = d.industries && d.industries.includes(r['行业']);
    html += `<tr class="${hl ? 'hl' : ''}"><td class="${hl ? 'lead' : ''}">${r['行业']}</td>
      <td class="num">${pct(r['近1年%'])}</td><td class="num">${pct(r['近3年%'])}</td></tr>`;
  });
  html += `</tbody></table>`;
  const wk = d.industry_weakest || [];
  if (wk.length)
    html += `<div class="note warn">✗ 回避: ${wk.map(r => `${r['行业']}(${r['近1年%']}%)`).join(' · ')}</div>`;
  html += `</div>`;

  // 右: 候选龙头(带结构关)
  html += `<div class="chart-card">
    <div class="card-header"><h3>候选龙头</h3>
      <span class="card-hint">行业强 ∩ 市值龙头 ∩ 结构过关</span></div>
    <table class="dense"><thead><tr><th>名称</th><th>代码</th>
      <th class="num">市值</th><th>结构</th><th class="num">涨跌</th><th class="num">5日</th></tr></thead><tbody>`;
  (d.leaders || []).forEach(l => {
    const v = l.veto;
    html += `<tr class="${v ? 'veto-row' : ''}">
      <td style="font-weight:600">${l.name}</td>
      <td style="font-family:var(--font-mono);color:var(--text-dim)">${l.code}</td>
      <td class="num">${l.mktcap_yi ?? '--'}</td>
      <td style="font-size:11px;color:${v ? 'var(--down)' : 'var(--text-dim)'};max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${v ? (l.veto_reason || '') : (l.structure || '')}">${v ? '✗ ' : '○ '}${(v ? (l.veto_reason || '否决') : (l.structure || '—')).split(';')[0].split('(')[0].trim()}</td>
      <td class="num">${chg(l.chg_pct)}</td>
      <td class="num">${chg(l.chg5_pct)}</td></tr>`;
  });
  html += `</tbody></table></div></div>`;

  // === 模拟持仓 + 交易记录 ===
  const pf = d.portfolio;
  if (pf) {
    html += `<div class="chart-card" style="margin-bottom:14px">
      <div class="card-header"><h3>策略模拟持仓</h3>
        <span class="card-hint">截至 ${pf.as_of} · 全期${pf.total_ret_pct > 0 ? '+' : ''}${pf.total_ret_pct}% / 回撤${pf.max_dd_pct}% · ${pf.n_trades}笔</span></div>`;
    if (pf.n_holdings === 0) {
      html += `<div style="padding:18px;color:var(--text-dim);font-size:12px">
        当前空仓 —— 等待 A 环境确认(主线需连续3天凝聚, 守则第一章)</div>`;
    } else {
      html += `<table class="dense"><thead><tr><th>代码</th><th>名称</th><th>买入日</th>
        <th class="num">买入</th><th class="num">现价</th><th class="num">浮盈</th><th class="num">权重</th></tr></thead><tbody>`;
      pf.holdings.forEach(h => {
        html += `<tr><td style="font-family:var(--font-mono)">${h.code}</td><td>${h.name}</td>
          <td style="font-family:var(--font-mono);color:var(--text-dim)">${h.entry_date}</td>
          <td class="num">${h.entry_px}</td><td class="num">${h.last_px}</td>
          <td class="num">${chg(h.pnl_pct)}</td><td class="num">${h.weight_pct}%</td></tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `</div>`;

    if ((pf.trades || []).length) {
      html += `<div class="chart-card">
        <div class="card-header"><h3>策略交易记录</h3>
          <span class="card-hint">共 ${pf.n_trades} 笔 · 最近 ${Math.min(20, pf.trades.length)} 笔</span></div>
        <table class="dense"><thead><tr><th>代码</th><th>名称</th><th>买入日</th><th>卖出日</th>
          <th class="num">买入</th><th class="num">卖出</th><th class="num">盈亏</th><th>原因</th></tr></thead><tbody>`;
        pf.trades.slice(0, 20).forEach(t => {
          html += `<tr><td style="font-family:var(--font-mono)">${t.code}</td><td>${t.name}</td>
            <td style="font-family:var(--font-mono);color:var(--text-dim)">${t.entry_date}</td>
            <td style="font-family:var(--font-mono);color:var(--text-dim)">${t.exit_date}</td>
            <td class="num">${t.entry_px}</td><td class="num">${t.exit_px}</td>
            <td class="num">${chg(t.pnl_pct)}</td>
            <td style="font-size:11px;color:var(--text-dim)">${t.reason}</td></tr>`;
        });
        html += `</tbody></table></div>`;
    }
  }

  html += `<div style="margin-top:14px;padding:12px 0;font-size:11px;color:var(--text-dim);line-height:1.7;border-top:1px solid var(--border)">
    决策链: 环境(A才做) → 行业走势强 → 市值龙头 → 结构关(力量/位置/博弈/节奏)。
    标的仅供研究，不构成投资建议。</div>`;

  document.getElementById('daily-container').innerHTML = html;
})();
</script>
</body>
</html>
