<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日决策 · 龙头量化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<style>
  /* === 交易终端风格 === */
  .env-strip {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; margin-bottom: 14px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
  }
  .env-strip .env-tag {
    font-size: 26px; font-weight: 700; font-family: var(--font-mono);
    padding: 4px 14px; border-radius: 4px;
  }
  .env-strip.A .env-tag { color: #fff; background: var(--up); }
  .env-strip.B .env-tag { color: #fff; background: var(--yellow); }
  .env-strip.C .env-tag { color: #fff; background: var(--blue); }
  .env-strip.D .env-tag { color: #fff; background: var(--down); }
  .env-strip .env-info { flex: 1; }
  .env-strip .env-desc { font-size: 14px; font-weight: 600; color: var(--text-bright); }
  .env-strip .env-why { font-size: 11px; color: var(--text-dim); margin-top: 3px; font-family: var(--font-mono); }
  .env-strip .env-action { text-align: right; }
  .env-strip .env-exp { font-size: 22px; font-weight: 700; font-family: var(--font-mono); color: var(--accent); }
  .env-strip .env-exp-label { font-size: 11px; color: var(--text-dim); }

  /* 大屏数字 */
  .stat-strip {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
    margin-bottom: 14px;
  }
  .stat-box {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 14px;
  }
  .stat-box .s-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .stat-box .s-value {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 26px; font-weight: 700; color: var(--text-bright); line-height: 1.1;
  }
  .stat-box .s-delta { font-size: 11px; margin-top: 4px; font-family: var(--font-mono); }
  .delta-up { color: var(--up); }
  .delta-down { color: var(--down); }
  .delta-flat { color: var(--text-dim); }

  /* 主栏布局 */
  .trade-grid {
    display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px;
  }

  /* 连板天梯 */
  .ladder-row { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--border); }
  .ladder-row:last-child { border-bottom: none; }
  .ladder-row:hover { background: var(--bg-hover); }
  .lb-num {
    font-family: var(--font-mono); font-weight: 700; font-size: 15px;
    width: 44px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px; flex-shrink: 0;
  }
  .lb-7 { background: var(--up); color: #fff; }
  .lb-6 { background: var(--up); color: #fff; }
  .lb-5 { background: rgba(217,82,79,0.75); color: #fff; }
  .lb-4 { background: rgba(217,82,79,0.55); color: #fff; }
  .lb-3 { background: rgba(217,82,79,0.35); color: var(--up); }
  .lb-2 { background: rgba(217,82,79,0.15); color: var(--up); }
  .ladder-name { font-weight: 600; color: var(--text-bright); width: 90px; }
  .ladder-code { font-family: var(--font-mono); color: var(--text-dim); font-size: 11px; width: 58px; }
  .ladder-ind { font-size: 11px; color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ladder-close, .ladder-chg {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    text-align: right; width: 70px;
  }
  .ladder-close { color: var(--text); }

  /* 热度条 */
  .heat-row { padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .heat-row:last-child { border-bottom: none; }
  .heat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .heat-name { font-size: 12px; color: var(--text); }
  .heat-num { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-weight: 600; }
  .heat-bar-bg { height: 5px; background: var(--bg-hover); border-radius: 3px; overflow: hidden; }
  .heat-bar { height: 100%; background: var(--accent); border-radius: 3px; }

  /* 报价表 */
  .quote-chg { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  .q-up { color: var(--up); }
  .q-down { color: var(--down); }
</style>
</head>
<body>

<main id="main">
  <div class="page-header">
    <div>
      <div class="page-title">每日决策</div>
      <div class="page-subtitle" id="snap">加载中...</div>
    </div>
    <button class="range-btn" onclick="location.reload()">↻ 刷新</button>
  </div>

  <div id="daily-container"><div class="loading">加载中</div></div>
</main>

<script src="js/shared.js"></script>
<script>
renderLayout('daily');

const chgHtml = (v) => {
  if (v === null || v === undefined) return '--';
  const cls = v > 0 ? 'q-up' : v < 0 ? 'q-down' : 'delta-flat';
  return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
};
const deltaHtml = (a, b) => {
  if (a === null || a === undefined || b === null || b === undefined) return '';
  const d = a - b;
  if (d === 0) return `<span class="delta-flat">持平</span>`;
  return `<span class="${d > 0 ? 'delta-up' : 'delta-down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>`;
};

(async () => {
  const d = await DataLoader.load('daily');
  if (!d) { showError('决策数据加载失败，请先运行: python main.py gen-webdata'); return; }
  document.getElementById('snap').textContent = `数据截至 ${d.snapshot_time}`;

  const actionMap = {
    A: '可持仓 · 做主线龙头 · 让利润奔跑',
    B: '轻仓或空仓 · 追热点易被套',
    C: '轻仓快进快出 · 严格止损',
    D: '空仓观望 · 保存实力',
  };

  // 环境条
  const st = d.stats || {};
  let html = `
    <div class="env-strip ${d.env}">
      <div class="env-tag">${d.env}</div>
      <div class="env-info">
        <div class="env-desc">${d.env_desc}</div>
        <div class="env-why">${d.why || ''}</div>
      </div>
      <div class="env-action">
        <div class="env-exp">${d.exposure_pct}%</div>
        <div class="env-exp-label">仓位上限</div>
      </div>
      <div style="font-size:12px;color:var(--text-dim);max-width:220px">${actionMap[d.env] || ''}</div>
    </div>
  `;

  // 涨停大屏
  if (st.date) {
    html += `
    <div class="stat-strip">
      <div class="stat-box"><div class="s-label">涨停家数</div>
        <div class="s-value">${st.zt_today}</div>
        <div class="s-delta">${deltaHtml(st.zt_today, st.zt_prev)}</div></div>
      <div class="stat-box"><div class="s-label">最高连板</div>
        <div class="s-value">${st.max_lb}</div>
        <div class="s-delta">空间板</div></div>
      <div class="stat-box"><div class="s-label">2板</div>
        <div class="s-value">${st.lb2_today}</div>
        <div class="s-delta">晋级层</div></div>
      <div class="stat-box"><div class="s-label">3板+</div>
        <div class="s-value">${st.lb3p_today}</div>
        <div class="s-delta">高位梯队</div></div>
      <div class="stat-box"><div class="s-label">环境</div>
        <div class="s-value" style="font-size:20px">${d.env}</div>
        <div class="s-delta">${d.env_desc.slice(0, 8)}</div></div>
      <div class="stat-box"><div class="s-label">仓位上限</div>
        <div class="s-value" style="font-size:20px;color:var(--accent)">${d.exposure_pct}%</div>
        <div class="s-delta">守则第五章</div></div>
    </div>`;
  }

  // 两栏: 天梯 + 热度
  html += `<div class="trade-grid">`;

  // 连板天梯
  html += `<div class="chart-card">
    <div class="card-header"><h3>连板天梯</h3>
      <span class="card-hint">${d.ladder_date || ''} · 连板≥2</span></div>
    <div style="max-height:420px;overflow-y:auto">`;
  if ((d.ladder || []).length) {
    d.ladder.forEach(l => {
      html += `<div class="ladder-row">
        <span class="lb-num lb-${Math.min(l.lianban, 7)}">${l.lianban}板</span>
        <span class="ladder-name">${l.name}</span>
        <span class="ladder-code">${l.code}</span>
        <span class="ladder-ind">${l.industry}</span>
        <span class="ladder-close">${l.close ?? '--'}</span>
        <span class="ladder-chg">${chgHtml(l.chg_pct)}</span>
      </div>`;
    });
  } else {
    html += `<div class="loading">当日无连板梯队</div>`;
  }
  html += `</div></div>`;

  // 情绪主线热度
  html += `<div class="chart-card">
    <div class="card-header"><h3>主线行业热度</h3>
      <span class="card-hint">涨停家数 + 连板高度×3</span></div>
    <div>`;
  const maxHeat = Math.max(...(d.industry_heat || []).map(h => h.heat), 1);
  (d.industry_heat || []).forEach(h => {
    html += `<div class="heat-row">
      <div class="heat-top"><span class="heat-name">${h.industry}</span>
      <span class="heat-num">${h.heat} <span style="color:var(--text-dim);font-weight:400">(${h.zt}家/${h.lb}板)</span></span></div>
      <div class="heat-bar-bg"><div class="heat-bar" style="width:${(h.heat / maxHeat * 100).toFixed(0)}%"></div></div>
    </div>`;
  });
  html += `</div></div></div>`;

  // 候选龙头报价
  html += `<div class="chart-card span-2" style="margin-top:14px">
    <div class="card-header"><h3>主线龙头 · 候选</h3>
      <span class="card-hint">情绪主线 ∩ 长期不弱 ∩ 行业龙头</span></div>
    <div class="table-wrap" style="max-height:none">
    <table><thead><tr><th>行业</th><th>代码</th><th>名称</th><th style="text-align:right">现价</th>
      <th style="text-align:right">涨跌幅</th><th style="text-align:right">5日</th></tr></thead><tbody>`;
  (d.leaders || []).forEach(l => {
    html += `<tr>
      <td>${l.industry}</td>
      <td style="font-family:var(--font-mono)">${l.code}</td>
      <td style="font-weight:600;color:var(--text-bright)">${l.name}</td>
      <td style="text-align:right;font-family:var(--font-mono)">${l.close ?? '--'}</td>
      <td style="text-align:right" class="quote-chg">${chgHtml(l.chg_pct)}</td>
      <td style="text-align:right" class="quote-chg">${chgHtml(l.chg5_pct)}</td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;

  // 策略模拟持仓 + 交易记录
  const pf = d.portfolio;
  if (pf) {
    html += `<div class="chart-card span-2" style="margin-top:14px">
      <div class="card-header"><h3>策略模拟持仓</h3>
        <span class="card-hint">滚动龙头池 + 只做A(滞后确认) · 截至 ${pf.as_of} · 全期${pf.total_ret_pct > 0 ? '+' : ''}${pf.total_ret_pct}% / 回撤${pf.max_dd_pct}%</span></div>`;
    if (pf.n_holdings === 0) {
      html += `<div style="padding:28px;text-align:center;color:var(--text-dim);font-size:13px">
        当前空仓 —— 等待A环境确认(主线需连续3天凝聚, 守则第一章)</div>`;
    } else {
      html += `<div class="table-wrap" style="max-height:340px">
      <table><thead><tr><th>代码</th><th>名称</th><th>行业</th><th>买入日</th>
        <th style="text-align:right">买入价</th><th style="text-align:right">现价</th>
        <th style="text-align:right">浮盈</th><th style="text-align:right">权重</th></tr></thead><tbody>`;
      pf.holdings.forEach(h => {
        html += `<tr>
          <td style="font-family:var(--font-mono)">${h.code}</td>
          <td style="font-weight:600;color:var(--text-bright)">${h.name}</td>
          <td>${(h.industry||'').slice(0,14)}</td>
          <td style="font-family:var(--font-mono)">${h.entry_date}</td>
          <td style="text-align:right;font-family:var(--font-mono)">${h.entry_px}</td>
          <td style="text-align:right;font-family:var(--font-mono)">${h.last_px}</td>
          <td style="text-align:right" class="quote-chg">${chgHtml(h.pnl_pct)}</td>
          <td style="text-align:right;font-family:var(--font-mono)">${h.weight_pct}%</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }
    html += `</div>`;

    html += `<div class="chart-card span-2" style="margin-top:14px">
      <div class="card-header"><h3>策略交易记录</h3>
        <span class="card-hint">共 ${pf.n_trades} 笔 · 最近${Math.min(30, pf.trades.length)}笔</span></div>
      <div class="table-wrap" style="max-height:340px">
      <table><thead><tr><th>代码</th><th>名称</th><th>买入日</th><th>卖出日</th>
        <th style="text-align:right">买入价</th><th style="text-align:right">卖出价</th>
        <th style="text-align:right">盈亏</th><th>原因</th></tr></thead><tbody>`;
      (pf.trades || []).forEach(t => {
        html += `<tr>
          <td style="font-family:var(--font-mono)">${t.code}</td>
          <td style="font-weight:600">${t.name}</td>
          <td style="font-family:var(--font-mono)">${t.entry_date}</td>
          <td style="font-family:var(--font-mono)">${t.exit_date}</td>
          <td style="text-align:right;font-family:var(--font-mono)">${t.entry_px}</td>
          <td style="text-align:right;font-family:var(--font-mono)">${t.exit_px}</td>
          <td style="text-align:right" class="quote-chg">${chgHtml(t.pnl_pct)}</td>
          <td style="font-size:11px;color:var(--text-dim)">${t.reason}</td>
        </tr>`;
      });
      html += `</tbody></table></div></div>`;
  }

  html += `<div style="margin-top:16px;padding:14px;font-size:11px;color:var(--text-dim);line-height:1.8;border-top:1px solid var(--border)">
    策略: 行业龙头池 + 只在A主线环境持有 + 低换手(3.5年+12年验证, 详见 STRATEGY_CONCLUSION.md)。
    连板天梯来自涨停事件数据; 报价来自日线缓存(收盘口径)。
    <br>本页面不构成投资建议。</div>`;

  document.getElementById('daily-container').innerHTML = html;
})();
</script>
</body>
</html>
