<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时概览 · Market Live</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<main id="main">
  <div class="page-header">
    <div>
      <div class="page-title">实时市场概览</div>
      <div class="page-subtitle" id="snapshot-time">快照时间: --</div>
    </div>
    <button class="range-btn" onclick="location.reload()">↻ 刷新</button>
  </div>

  <div class="kpi-row" id="live-kpi">
    <div class="loading">加载中</div>
  </div>

  <!-- 实时接口不可用时, 整页给出明确说明, 而不是铺满 '--' -->
  <div id="live-source-warning" style="margin-bottom:12px"></div>

  <div class="chart-grid">
    <div class="chart-card span-2">
      <div class="card-header"><h3>主要指数</h3></div>
      <div id="index-table" class="table-wrap flush"></div>
    </div>

    <div class="chart-card">
      <div class="card-header"><h3>板块涨幅 TOP10</h3></div>
      <div id="sector-top-chart" class="chart-body"></div>
    </div>

    <div class="chart-card">
      <div class="card-header"><h3>板块跌幅 TOP5</h3></div>
      <div id="sector-bottom-chart" class="chart-body"></div>
    </div>

    <div class="chart-card span-2">
      <div class="card-header">
        <h3>涨停股 TOP20</h3>
        <span class="card-hint" id="lu-count">--</span>
      </div>
      <div id="limit-up-table" class="table-wrap"></div>
    </div>

    <div class="chart-card span-2">
      <div class="card-header">
        <h3>主力资金流向 TOP10</h3>
      </div>
      <div id="money-flow-table" class="table-wrap"></div>
    </div>
  </div>
</main>

<script src="js/shared.js"></script>
<script>
renderLayout('live');

(async () => {
  const data = await DataLoader.load('live');
  if (!data) { showError('实时数据加载失败，请先运行: python src/sentiment/gen_webdata_v2.py'); return; }
  
  document.getElementById('snapshot-time').textContent = `快照时间: ${data.snapshot_time}`;

  // 数据可用性判定: 涨停家数缺失 => 实时接口(akshare 实时行情)本次没取到,
  // 此时铺满 '--' 只会让人以为页面坏了, 改为整页一条明确说明。
  const hasLive = (data.limit_up_count || 0) > 0;
  if (!hasLive) {
    document.getElementById('live-source-warning').innerHTML = `
      <div class="card-header" style="border:1px solid var(--border);border-radius:3px 3px 0 0;background:#faf0dd">
        <h3 style="color:var(--warn)">实时行情接口本次未取到数据</h3>
        <span class="card-hint">快照时间 ${data.snapshot_time} · 情绪与回测数据不受影响</span>
      </div>
      <div class="note" style="border:1px solid var(--border);border-top:none;border-radius:0 0 3px 3px">
        实时涨停/资金流向依赖 akshare 盘中接口, 非交易时段或接口不可用时会缺失。
        生成命令: <code>python src/sentiment/gen_webdata_v2.py</code>
      </div>`;
    document.getElementById('live-kpi').innerHTML =
      `<div class="kpi-card"><div class="kpi-label">数据状态</div>
        <div class="kpi-value is-date">实时接口不可用</div>
        <div class="kpi-sub">下方各表为历史快照, 非当日盘中数据</div></div>`;
  } else {
    const luN = data.limit_up_count, ldN = data.limit_down_count;
    document.getElementById('live-kpi').innerHTML = `
      <div class="kpi-card good">
        <div class="kpi-label">涨停</div>
        <div class="kpi-value">${luN}</div>
      </div>
      <div class="kpi-card alert">
        <div class="kpi-label">跌停</div>
        <div class="kpi-value">${ldN > 0 ? ldN : '0'}</div>
      </div>
      ${(data.indices || []).slice(0, 4).map(idx => `
        <div class="kpi-card ${(idx.chg_pct || 0) >= 0 ? 'good' : 'alert'}">
          <div class="kpi-label">${idx.name || idx.code}</div>
          <div class="kpi-value is-date">${fmt(idx.close)}</div>
          <div class="kpi-sub">${chgHtml(idx.chg_pct)}</div>
        </div>
      `).join('')}`;
  }

  // 指数表
  if (data.indices && data.indices.length > 0) {
    document.getElementById('index-table').innerHTML = `<table><thead><tr>
      <th>指数</th><th class="num">收盘</th><th class="num">涨跌幅</th><th class="num">涨跌</th><th class="num">成交额</th>
    </tr></thead><tbody>
      ${data.indices.map(idx => `
        <tr>
          <td>${idx.name || '--'}</td>
          <td class="num">${fmt(idx.close)}</td>
          <td class="num ${(idx.chg_pct || 0) >= 0 ? 'profit' : 'loss'}">${chgHtml(idx.chg_pct)}</td>
          <td class="num ${(idx.chg || 0) >= 0 ? 'profit' : 'loss'}">${fmt(idx.chg)}</td>
          <td class="num">${fmtMoney(idx.amount)}</td>
        </tr>
      `).join('')}
    </tbody></table>`;
  } else {
    renderEmpty('index-table', '无指数快照数据');
  }

  // 板块涨跌图表 —— 红涨绿跌
  if (data.sectors_top && data.sectors_top.length > 0) {
    makePlot('sector-top-chart', [{
      x: data.sectors_top.map(s => s['板块名称']),
      y: data.sectors_top.map(s => s['涨跌幅']),
      type: 'bar', marker: { color: C.up }, name: '涨幅',
      hovertemplate: '%{x}<br>%{y:.2f}%<extra></extra>',
    }], { height: CHART_H, showlegend: false, xaxis: { tickangle: -30, tickfont: { size: 9 } }, yaxis: { title: '%', gridcolor: C.grid } });
  } else {
    renderEmpty('sector-top-chart', '无板块涨幅数据');
  }

  if (data.sectors_bottom && data.sectors_bottom.length > 0) {
    makePlot('sector-bottom-chart', [{
      x: data.sectors_bottom.map(s => s['板块名称']),
      y: data.sectors_bottom.map(s => s['涨跌幅']),
      type: 'bar', marker: { color: C.down }, name: '跌幅',
      hovertemplate: '%{x}<br>%{y:.2f}%<extra></extra>',
    }], { height: CHART_H, showlegend: false, xaxis: { tickangle: -30, tickfont: { size: 9 } }, yaxis: { title: '%', gridcolor: C.grid } });
  } else {
    renderEmpty('sector-bottom-chart', '无板块跌幅数据');
  }

  // 涨停表
  document.getElementById('lu-count').textContent = hasLive
    ? `共 ${data.limit_up_count} 家`
    : '实时接口不可用';
  if (data.limit_up_top20 && data.limit_up_top20.length > 0) {
    document.getElementById('limit-up-table').innerHTML = `<table><thead><tr>
      <th>代码</th><th>名称</th><th class="num">现价</th><th class="num">涨跌幅</th><th class="num">成交额</th><th class="num">换手率</th>
    </tr></thead><tbody>
      ${data.limit_up_top20.map(s => `
        <tr>
          <td style="font-family:var(--mono)">${s.code}</td>
          <td>${s.name}</td>
          <td class="num">${fmt(s.close)}</td>
          <td class="num profit">${chgHtml(s.chg_pct)}</td>
          <td class="num">${fmtMoney(s.amount)}</td>
          <td class="num">${fmt(s.turnover)}%</td>
        </tr>
      `).join('')}
    </tbody></table>`;
  } else {
    renderEmpty('limit-up-table', '无涨停股数据', '实时接口不可用时该表为空');
  }

  // 主力资金
  if (data.money_flow_top10 && data.money_flow_top10.length > 0) {
    document.getElementById('money-flow-table').innerHTML = `<table><thead><tr>
      <th>代码</th><th>名称</th><th class="num">现价</th><th class="num">涨跌幅</th><th class="num">主力净流入</th>
    </tr></thead><tbody>
      ${data.money_flow_top10.map(s => `
        <tr>
          <td style="font-family:var(--mono)">${s.code}</td>
          <td>${s.name}</td>
          <td class="num">${fmt(s.close)}</td>
          <td class="num ${(s.chg_pct || 0) >= 0 ? 'profit' : 'loss'}">${chgHtml(s.chg_pct)}</td>
          <td class="num ${(s.main_net || 0) >= 0 ? 'profit' : 'loss'}">${fmtMoney(s.main_net)}</td>
        </tr>
      `).join('')}
    </tbody></table>`;
  } else {
    renderEmpty('money-flow-table', '无资金流向数据', '实时接口不可用时该表为空');
  }
})();
</script>
</body>
</html>
