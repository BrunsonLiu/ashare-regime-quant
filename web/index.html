<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪终端 · Sentiment Terminal</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<main id="main">
  <div class="page-header">
    <div>
      <div class="page-title">情绪终端</div>
      <div class="page-subtitle">涨停 / 炸板 / 连板 / 周期分析</div>
    </div>
  </div>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="overview">情绪总览</button>
    <button class="tab-btn" data-tab="cycle">周期分析</button>
    <button class="tab-btn" data-tab="backtest">回测绩效</button>
    <button class="tab-btn" data-tab="trades">交易流水</button>
    <button class="tab-btn" data-tab="walkforward">滚动验证</button>
  </nav>

  <section id="tab-overview" class="tab-content active">
    <div class="kpi-row" id="kpi-row"><div class="loading">加载中</div></div>
    <div class="chart-grid">
      <div class="chart-card span-2">
        <div class="card-header">
          <h3>涨停家数 vs 炸板率</h3>
          <div class="card-actions">
            <button class="range-btn active" data-range="all">3年</button>
            <button class="range-btn" data-range="1y">1年</button>
            <button class="range-btn" data-range="3m">3月</button>
          </div>
        </div>
        <div id="chart-zt-zhaban" class="chart-body tall"></div>
      </div>
      <div class="chart-card">
        <div class="card-header"><h3>最高连板走势</h3><span class="card-hint">近250日</span></div>
        <div id="chart-lianban-height" class="chart-body"></div>
      </div>
      <div class="chart-card">
        <div class="card-header"><h3>首板占比</h3><span class="card-hint">近120日</span></div>
        <div id="chart-shouban" class="chart-body"></div>
      </div>
      <div class="chart-card span-2">
        <div class="card-header"><h3>连板梯队结构</h3><span class="card-hint">近60日</span></div>
        <div id="chart-lianban" class="chart-body"></div>
      </div>
      <div class="chart-card span-2">
        <div class="card-header"><h3>月度情绪热力图</h3><span class="card-hint">日均涨停家数</span></div>
        <div id="chart-monthly-heat" class="chart-body"></div>
      </div>
    </div>
  </section>

  <section id="tab-cycle" class="tab-content">
    <div class="kpi-row" id="cycle-kpi"></div>
    <div class="chart-grid">
      <div class="chart-card span-2">
        <div class="card-header"><h3>冰点 / 高潮标记</h3><span class="card-hint">蓝=冰点 · 红=高潮</span></div>
        <div id="chart-bing-gao" class="chart-body tall"></div>
      </div>
      <div class="chart-card">
        <div class="card-header"><h3>年度情绪对比</h3></div>
        <div id="chart-yearly" class="chart-body"></div>
      </div>
      <div class="chart-card">
        <div class="card-header"><h3>冰点反转统计</h3></div>
        <div id="reversal-stats" class="stats-body"></div>
      </div>
      <div class="chart-card span-2">
        <div class="card-header"><h3>连板梯队 (近60日)</h3></div>
        <div id="chart-echelon" class="chart-body"></div>
      </div>
    </div>
  </section>

  <section id="tab-backtest" class="tab-content">
    <div class="kpi-row" id="bt-kpi"></div>
    <div class="chart-grid">
      <div class="chart-card span-2">
        <div class="card-header"><h3>净值曲线</h3></div>
        <div id="chart-equity" class="chart-body tall"></div>
      </div>
      <div class="chart-card">
        <div class="card-header"><h3>回撤曲线</h3></div>
        <div id="chart-drawdown" class="chart-body"></div>
      </div>
      <div class="chart-card span-2">
        <div class="card-header"><h3>市场状态时间线</h3></div>
        <div id="chart-regime" class="chart-body short"></div>
      </div>
    </div>
  </section>

  <section id="tab-trades" class="tab-content">
    <div class="table-controls">
      <input type="text" id="trade-search" placeholder="搜索代码 / 信号 / 原因..." class="search-input">
      <button class="range-btn active" data-sort="date">按日期</button>
      <button class="range-btn" data-sort="pnl">按盈亏</button>
    </div>
    <div class="table-wrap"><table id="trade-table"><thead><tr id="trade-header"></tr></thead><tbody id="trade-body"></tbody></table></div>
  </section>

  <section id="tab-walkforward" class="tab-content">
    <div class="chart-card span-2">
      <div class="card-header"><h3>Walk-Forward 滚动验证</h3><span class="card-hint">分段样本外检验</span></div>
      <div id="chart-wf" class="chart-body tall"></div>
    </div>
    <div id="wf-table-wrap" class="table-wrap"></div>
  </section>
</main>

<script src="js/shared.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script>
renderLayout('sentiment');

// 页签点击: 切类名 + 写回 hash, 保证刷新后停在同一页
document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    const name = btn.dataset.tab;
    location.hash = `tab-${name}`;
    App.switchTab(name);
  });
});
</script>
</body>
</html>
