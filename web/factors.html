<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>因子分析 · Factor Analysis</title>
<script src="vendor/plotly-cartesian-2.35.2.min.js"></script>
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<main id="main">
  <div class="page-header">
    <div>
      <div class="page-title">因子有效性分析</div>
      <div class="page-subtitle">IC / IR / 分组单调性 · 因子筛选数据化</div>
    </div>
  </div>

  <div class="kpi-row" id="factor-kpi">
    <div class="loading">加载中</div>
  </div>

  <div class="chart-grid">
    <div class="chart-card span-2">
      <div class="card-header">
        <h3>IC 均值对比（按因子分组）</h3>
        <span class="card-hint">|IC|>0.03 有效，IR>0.5 优秀</span>
      </div>
      <div id="chart-ic-compare" class="chart-body tall"></div>
    </div>

    <div class="chart-card">
      <div class="card-header"><h3>IC 胜率</h3></div>
      <div id="chart-ic-winrate" class="chart-body"></div>
    </div>

    <div class="chart-card">
      <div class="card-header"><h3>多空收益差</h3></div>
      <div id="chart-long-short" class="chart-body"></div>
    </div>

    <div class="chart-card span-2">
      <div class="card-header"><h3>IC 详细数据</h3></div>
      <div id="ic-table-wrap" class="table-wrap"></div>
    </div>

    <div class="chart-card span-2">
      <div class="card-header"><h3>分组收益对比</h3></div>
      <div id="quantile-table-wrap" class="table-wrap"></div>
    </div>
  </div>
</main>

<script src="js/shared.js"></script>
<script>
renderLayout('factors');

(async () => {
  const data = await DataLoader.load('factors');
  if (!data) { showError('因子数据加载失败，请先运行: python main.py factors'); return; }
  
  const factors = data.factor_list || [];
  const icir = data.icir || [];
  const quantile = data.quantile || [];
  
  // KPI
  // 用后端算好的'评估'列(唯一口径: |IR|>0.5且胜率>0.55=有效; |IR|>0.3=一般)
  // —— 不再前端自定阈值, 避免与后端 factor_analysis.py 判定漂移
  const verdictOf = (r) => {
    const v = String(r['评估'] || '');
    if (v.includes('有效') && !v.includes('无')) return 'valid';
    if (v.includes('一般')) return 'general';
    return 'invalid';
  };
  const validCount = icir.filter(r => verdictOf(r) === 'valid').length;
  const generalCount = icir.filter(r => verdictOf(r) === 'general').length;
  document.getElementById('factor-kpi').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">因子总数</div>
      <div class="kpi-value">${factors.length}</div>
    </div>
    <div class="kpi-card ${validCount ? 'good' : ''}">
      <div class="kpi-label">有效因子</div>
      <div class="kpi-value">${validCount}</div>
      <div class="kpi-sub">|IR|>0.5 且 胜率>0.55</div>
    </div>
    <div class="kpi-card warn">
      <div class="kpi-label">一般</div>
      <div class="kpi-value">${generalCount}</div>
      <div class="kpi-sub">|IR| &gt; 0.3</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">IC记录数</div>
      <div class="kpi-value">${icir.length}</div>
      <div class="kpi-sub">因子 × 周期</div>
    </div>
  `;
  
  // IC 均值对比（按因子聚合取平均）
  // 注意: 后端已是百分数字符串(如 "42.5%"), parseFloat 后已是 42.5, 不能再 *100
  const pctNum = (v) => parseFloat(v);
  const factorIC = {};
  icir.forEach(r => {
    const f = r['因子'];
    if (!factorIC[f]) factorIC[f] = { ic: [], ir: [], winrate: [] };
    factorIC[f].ic.push(parseFloat(r['IC均值']));
    factorIC[f].ir.push(parseFloat(r['IR']));
    factorIC[f].winrate.push(pctNum(r['IC胜率']));
  });

  const fNames = Object.keys(factorIC);
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const avgIC = fNames.map(f => mean(factorIC[f].ic));
  const avgIR = fNames.map(f => mean(factorIC[f].ir));
  const avgWR = fNames.map(f => mean(factorIC[f].winrate));
  
  makePlot('chart-ic-compare', [
    { x: fNames, y: avgIC, type: 'bar', name: 'IC均值',
      marker: { color: avgIC.map(v => v >= 0 ? C.up : C.down) },
      hovertemplate: '%{x}<br>IC %{y:.4f}<extra></extra>' },
    { x: fNames, y: avgIR, type: 'scatter', mode: 'lines+markers', name: 'IR',
      line: { color: C.accent, width: 2 }, marker: { size: 6 },
      yaxis: 'y2', hovertemplate: 'IR %{y:.3f}<extra></extra>' },
  ], {
    height: CHART_H_TALL,
    yaxis: { title: 'IC', gridcolor: C.grid, tickfont: { size: 9 } },
    yaxis2: { title: 'IR', overlaying: 'y', side: 'right', gridcolor: 'rgba(0,0,0,0)', tickfont: { size: 9 } },
    margin: { l: 52, r: 48, t: 12, b: 34 },
  });

  // IC 胜率 —— 已是百分数, 不再乘 100
  makePlot('chart-ic-winrate', [{
    x: fNames, y: avgWR, type: 'bar', name: 'IC胜率%',
    marker: { color: avgWR.map(v => v >= 50 ? C.up : C.down) },
    hovertemplate: '%{x}<br>胜率 %{y:.1f}%<extra></extra>',
  }], { height: CHART_H, yaxis: { title: '%', gridcolor: C.grid, tickfont: { size: 9 }, range: [0, 100] } });

  // 多空收益差 —— 后端已是百分数, 不再乘 100
  if (quantile.length > 0) {
    const qNames = quantile.map(r => r['因子']);
    const lsDiff = quantile.map(r => parseFloat(r['多空差']));
    makePlot('chart-long-short', [{
      x: qNames, y: lsDiff, type: 'bar', name: '多空差%',
      marker: { color: lsDiff.map(v => v >= 0 ? C.up : C.down) },
      hovertemplate: '%{x}<br>多空差 %{y:.2f}%<extra></extra>',
    }], { height: CHART_H, yaxis: { title: '%', gridcolor: C.grid, tickfont: { size: 9 } } });
  }

  // IC 表
  document.getElementById('ic-table-wrap').innerHTML = `
    <table><thead><tr>
      <th>因子</th><th>周期</th><th class="num">IC均值</th><th class="num">IC标准差</th>
      <th class="num">IR</th><th class="num">IC胜率</th><th class="num">样本数</th><th>评估</th>
    </tr></thead><tbody>
      ${icir.map(r => {
        const ic = parseFloat(r['IC均值']);
        const ir = parseFloat(r['IR']);
        return `<tr>
          <td>${r['因子']}</td>
          <td style="font-family:var(--mono);color:var(--text-3)">${r['周期']}</td>
          <td class="num ${ic >= 0 ? 'profit' : 'loss'}">${r['IC均值']}</td>
          <td class="num">${r['IC标准差']}</td>
          <td class="num ${Math.abs(ir) > 0.5 ? 'profit' : ''}">${r['IR']}</td>
          <td class="num">${r['IC胜率']}</td>
          <td class="num">${r['样本数']}</td>
          <td>${r['评估']}</td>
        </tr>`;
      }).join('')}
    </tbody></table>`;

  // 分组表
  document.getElementById('quantile-table-wrap').innerHTML = `
    <table><thead><tr>
      <th>因子</th><th class="num">多组平均</th><th class="num">空组平均</th>
      <th class="num">多空差</th><th class="num">多空胜率</th><th>单调性</th>
    </tr></thead><tbody>
      ${quantile.map(r => {
        const diff = parseFloat(r['多空差']);
        return `<tr>
          <td>${r['因子']}</td>
          <td class="num">${r['多组平均']}</td>
          <td class="num">${r['空组平均']}</td>
          <td class="num ${diff >= 0 ? 'profit' : 'loss'}">${r['多空差']}</td>
          <td class="num">${r['多空胜率']}</td>
          <td>${r['分组单调']}</td>
        </tr>`;
      }).join('')}
    </tbody></table>`;
})();
</script>
</body>
</html>
